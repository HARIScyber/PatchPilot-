name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m ruff check app tests
        working-directory: backend
      - run: python -m pytest tests -v
        working-directory: backend

  credential-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/credential-scan.py

  backend-docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t patchpilot-backend ./backend
      - name: Start backend container
        run: docker run -d --rm -p 8000:8000 -e PORT=8000 --name patchpilot-smoke patchpilot-backend
      - name: Check health and packaged sample
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f patchpilot-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/tmp/health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          cat /tmp/health.json
          curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/projects/load-sample >/tmp/sample.json
          cat /tmp/sample.json
          python -c "import json; p=json.load(open('/tmp/sample.json')); assert p['file_count'] >= 3; print('Bundled sample files:', p['file_count'])"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node scripts/contrast-check.mjs
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
