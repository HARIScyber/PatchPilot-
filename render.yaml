services:
  - type: web
    name: patchpilot-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SIGNING_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: meta
      - key: MODEL_API_KEY
        sync: false
      - key: META_MODEL_ID
        sync: false
      - key: META_API_BASE_URL
        sync: false
      - key: APP_MODE
        sync: false
      - key: DEMO_MODE
        sync: false
      - key: EXECUTION_BACKEND
        sync: false
      - key: ENABLE_UPLOAD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_DAILY_META_CALL_CAP
        sync: false
      - key: PUBLIC_MAX_ATTEMPTS
        sync: false
      - key: PUBLIC_MAX_TOKENS_PER_CALL
        sync: false
      - key: PUBLIC_DEMO_ENABLED
        sync: false
      - key: PUBLIC_AI_ENABLED
        sync: false
